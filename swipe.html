<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Подбор</title><style>
body{overflow:hidden;height:100vh;
  background:radial-gradient(120% 60% at 50% -10%,#241C42 0%,#0F1115 60%)}
.tabs{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3);overflow-x:auto}
#deck{position:relative;height:calc(100vh - 320px);min-height:320px;margin:0 var(--sp-4)}
.card{position:absolute;inset:0;border-radius:var(--r-l);overflow:hidden;
  background:var(--surface-container);border:1px solid #FFFFFF14;
  box-shadow:0 18px 44px #0009;touch-action:none;
  transform:translateY(calc(var(--i)*10px)) scale(calc(1 - var(--i)*.05));
  transition:transform var(--t-med)}
.card .art{position:absolute;inset:0;background:var(--bg)}
.card .g{position:absolute;inset:0;background:linear-gradient(#0000 30%,#0F1115F0 88%)}
.card .c{position:absolute;left:0;right:0;bottom:0;padding:var(--sp-4)}
.card h2{font-size:20px;line-height:1.2;margin:var(--sp-2) 0}
.card .gg{display:flex;gap:6px;flex-wrap:wrap;margin:var(--sp-3) 0}
.card p{font-size:13px;line-height:1.45;color:var(--on-surface-variant);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stamp{position:absolute;top:24px;font-size:22px;font-weight:800;letter-spacing:1px;
  padding:6px 14px;border-radius:var(--r-s);border:3px solid;opacity:0;pointer-events:none}
.stamp.y{left:20px;color:#4CD964;border-color:#4CD964;transform:rotate(-12deg)}
.stamp.n{right:20px;color:var(--error);border-color:var(--error);transform:rotate(12deg)}
.stamp.u{left:50%;top:40%;transform:translateX(-50%);color:#FF9F0A;border-color:#FF9F0A}
.acts{display:flex;justify-content:center;align-items:center;gap:var(--sp-4);
  padding:var(--sp-6) var(--sp-4) 0}
.acts button{border:none;border-radius:50%;background:var(--surface-variant);
  color:var(--on-surface);display:flex;align-items:center;justify-content:center}
.a-sm{width:46px;height:46px;font-size:18px}
.a-lg{width:62px;height:62px;font-size:24px}
.a-no{color:var(--error)!important;box-shadow:0 0 18px #FF5C5C33}
.a-yes{background:linear-gradient(145deg,#4CD964,#28A745)!important;color:#fff!important;
  box-shadow:0 8px 22px #28A74566}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--sp-4);text-align:center}
.ch{display:flex;align-items:center;padding:var(--sp-3) 0;border-bottom:1px solid var(--outline)}
</style></head><body>
<div class="appbar"><h1>Подбор</h1><button class="icon" id="undo">↶</button>
  <button class="icon" onclick="App.sheet(1)">⚙</button></div>
<div class="tabs" id="f"><button class="chip" aria-selected="true">Всё</button>
  <button class="chip">Манга</button><button class="chip">Аниме</button>
  <button class="chip">Ранобэ</button></div>
<div id="deck"></div>
<div class="acts"><button class="a-sm" id="bUndo">↶</button>
  <button class="a-lg a-no" id="bNo">✕</button><button class="a-sm" id="bUp">☆</button>
  <button class="a-lg a-yes" id="bYes">✚</button><button class="a-sm" id="bInfo">i</button></div>
<div class="scrim" id="sc" onclick="App.sheet(0)"></div>
<div class="sheet" id="sh"><h3>Добавить в категорию</h3><div id="cats"></div></div>
<script src="nav.js" data-tab="fab"></script>
<script>
var CATS=["Посмотрю позже","Читаю сейчас","Избранное","Отложено"];
var pool=DB.items.slice(),i=0,hist=[],lock=false,filt=0;
var deck=document.getElementById('deck');
function list(){return filt?pool.filter(function(x){return x.type===filt}):pool}
function card(it,idx){var fr=App.frOfItem(it.id);
 return '<div class="card" style="--i:'+idx+';--bg:'+it.bg+'">'+
 '<div class="art"></div><div class="g"></div>'+
 '<div class="stamp y">В СПИСОК</div><div class="stamp n">МИМО</div>'+
 '<div class="stamp u">КАТЕГОРИЯ</div><div class="c">'+
 '<div class="row" style="gap:6px"><span class="tag new">'+DB.typeName[it.type]+'</span>'+
 '<span class="tag">'+it.y+'</span><span class="tag">'+(it.r?'★ '+it.r:'без оценки')+'</span></div>'+
 '<h2>'+fr.t+'</h2><div class="muted">'+it.src+' · '+it.count+'</div>'+
 '<div class="gg">'+fr.g.map(function(g){return '<span class="chip">'+g+'</span>'}).join('')+
 '</div><p>'+fr.d+'</p></div></div>'}
function render(){var L=list();
 if(i>=L.length){deck.innerHTML='<div class="empty"><div style="font-size:40px">✧</div>'+
  '<div>Карточки кончились</div><div class="muted">Смените фильтр или обновите подборку</div>'+
  '<button class="btn primary" onclick="i=0;render()">Показать снова</button></div>';return}
 var h='';for(var k=Math.min(i+2,L.length-1);k>=i;k--)h+=card(L[k],k-i);
 deck.innerHTML=h;bind()}
function bind(){var el=deck.lastElementChild;if(!el||!el.classList.contains('card'))return;
 var st=el.querySelectorAll('.stamp'),x=0,y=0,sx=0,sy=0,drag=false;
 el.onpointerdown=function(e){if(lock)return;drag=true;sx=e.clientX;sy=e.clientY;
  el.setPointerCapture(e.pointerId);el.style.transition='none'};
 el.onpointermove=function(e){if(!drag)return;x=e.clientX-sx;y=e.clientY-sy;
  el.style.transform='translate('+x+'px,'+y+'px) rotate('+x/22+'deg)';
  var up=y<-70&&Math.abs(x)<60;
  st[0].style.opacity=up?0:Math.max(0,Math.min(1,x/110));
  st[1].style.opacity=up?0:Math.max(0,Math.min(1,-x/110));
  st[2].style.opacity=up?Math.min(1,-y/110):0};
 el.onpointerup=function(){if(!drag)return;drag=false;el.style.transition='';
  if(y<-110&&Math.abs(x)<80)return chooseCat();
  if(x>110)return fly(1);if(x<-110)return fly(-1);
  el.style.transform='';[].forEach.call(st,function(s){s.style.opacity=0})}}
function fly(dir,cat){var el=deck.lastElementChild;if(!el||lock)return;lock=true;
 el.style.transition='transform 260ms ease-out,opacity 260ms';
 el.style.transform='translate('+dir*innerWidth*1.2+'px,60px) rotate('+dir*26+'deg)';
 el.style.opacity=0;
 var it=list()[i],name=App.frOfItem(it.id).t;hist.push(i);i++;
 setTimeout(function(){lock=false;render();
  App.toast(dir>0?'«'+name+'» → '+(cat||CATS[0]):'«'+name+'» пропущен',back)},240)}
function chooseCat(){var el=deck.lastElementChild;el.style.transform='';
 [].forEach.call(el.querySelectorAll('.stamp'),function(s){s.style.opacity=0});
 cats.innerHTML=CATS.map(function(c){return '<div class="ch" onclick="App.sheet(0);fly(1,\''+
  c+'\')"><div style="flex:1">'+c+'</div><span>›</span></div>'}).join('');
 App.sheet(1)}
function back(){if(!hist.length)return;i=hist.pop();render()}
bNo.onclick=function(){fly(-1)};bYes.onclick=function(){fly(1)};bUp.onclick=chooseCat;
bUndo.onclick=back;undo.onclick=back;
bInfo.onclick=function(){var it=list()[i];if(it)location.href='title.html?id='+it.id};
var M={"Всё":0,"Манга":"manga","Аниме":"anime","Ранобэ":"novel"};
App.chips(f,function(n){filt=M[n];i=0;hist=[];render()});
render();
</script><script src="anim.js"></script>
<script src="auth.js"></script>
</body></html>
