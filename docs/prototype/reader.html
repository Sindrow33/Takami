<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Ридер</title><style>
body{background:#000;overflow-x:hidden}
#pages{display:flex;flex-direction:column;align-items:center}
#pages.paged{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;height:100vh}
#pages.paged .pg{min-width:100vw;height:100vh;scroll-snap-align:center;
  display:flex;align-items:center;justify-content:center}
#pages.rtl{flex-direction:row-reverse}
.pg{width:100%;max-width:var(--pw,100%)}
.pg .img{width:100%;background:linear-gradient(160deg,#20242C,#12151A);
  display:flex;align-items:center;justify-content:center;color:#4A5160;font-size:14px}
.divider{padding:var(--sp-8) var(--sp-4);text-align:center;
  color:var(--on-surface-variant);font-size:14px;background:#000}
.tap{position:fixed;inset:0;z-index:10;display:flex}
.tap div{flex:1}
.top,.bot{position:fixed;left:0;right:0;z-index:40;background:#0F1115EE;
  transition:transform var(--t-med)}
.top{top:0;padding:var(--sp-3) var(--sp-4);transform:translateY(-100%)}
.bot{bottom:0;padding:var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  transform:translateY(100%)}
.ui-open .top,.ui-open .bot{transform:none}
.pill{position:fixed;bottom:calc(var(--sp-4) + env(safe-area-inset-bottom));right:var(--sp-4);
  z-index:35;background:#0F1115CC;color:var(--on-surface-variant);font-size:12px;
  padding:4px 10px;border-radius:var(--r-full)}
</style></head><body class="immersive">
<div class="tap" id="tap"><div data-z="prev"></div><div data-z="menu"></div>
  <div data-z="next"></div></div>
<div id="pages"></div>
<div class="top"><div class="row"><a class="icon" onclick="App.back()">←</a>
  <div style="flex:1"><div style="font-size:14px" id="chn"></div>
  <div class="muted" id="tn"></div></div>
  <button class="icon" onclick="App.sheet(1)">⚙</button></div></div>
<div class="bot"><input type="range" id="slider" min="1" max="18" value="1">
  <div class="row" style="justify-content:space-between;margin-top:var(--sp-2)">
  <button class="chip">← Пред.</button><span class="muted" id="cnt">1 / 18</span>
  <button class="chip">След. →</button></div></div>
<div class="pill" id="pill">1 / 18</div>
<div class="scrim" id="sc" onclick="App.sheet(0)"></div>
<div class="sheet" id="sh"><h3>Режим чтения</h3>
  <div class="seg" id="mode"><button class="on" data-m="web">Вебтун</button>
   <button data-m="ltr">Страницы</button><button data-m="rtl">Манга RTL</button></div>
  <h3 style="margin-top:var(--sp-6)">Ширина страницы</h3>
  <input type="range" id="pw" min="60" max="100" value="100">
  <h3 style="margin-top:var(--sp-6)">Яркость</h3>
  <input type="range" id="br" min="30" max="100" value="100">
  <div class="row" style="margin-top:var(--sp-6);justify-content:space-between">
   <span>Держать экран включённым</span><input type="checkbox" checked></div></div>
<script>
var it=App.item(App.q('id',1));
chn.textContent='Глава '+App.q('ch',43);tn.textContent=App.frOfItem(it.id).t;
var H=[900,1400,1100,1600,1000,1300,1200,900,1500,1000,1400,1100,1250,950,1350,1150,1050,1450];
pages.innerHTML=H.map(function(h,i){return '<div class="pg"><div class="img" style="height:'+
 h/3+'px">'+(i+1)+'</div></div>'}).join('')+
 '<div class="divider">Конец главы<br><br><button class="btn primary">Читать дальше</button></div>';
var ui=false;
function setUI(v){ui=v;document.body.classList.toggle('ui-open',v)}
tap.onclick=function(e){var z=e.target.dataset.z;
 if(z==='menu')return setUI(!ui);
 if(pages.classList.contains('paged'))
  return pages.scrollBy({left:(z==='next'?1:-1)*innerWidth,behavior:'smooth'});
 setUI(!ui)};
mode.onclick=function(e){var b=e.target.closest('button');if(!b)return;
 [].forEach.call(mode.children,function(x){x.classList.remove('on')});b.classList.add('on');
 var m=b.dataset.m;pages.className=m==='web'?'':'paged'+(m==='rtl'?' rtl':'')};
pw.oninput=function(e){document.documentElement.style.setProperty('--pw',e.target.value+'%')};
br.oninput=function(e){pages.style.filter='brightness('+e.target.value+'%)'};
addEventListener('scroll',function(){
 var d=Math.max(1,document.body.scrollHeight-innerHeight);
 var p=Math.min(H.length,1+Math.floor(scrollY/d*H.length));
 pill.textContent=p+' / '+H.length;cnt.textContent=p+' / '+H.length;slider.value=p});
</script><script src="srcpick.js"></script>
<script src="migrate.js"></script>
<script src="hist.js"></script>
<script src="nav.js" data-tab=""></script>
<script src="anim.js"></script>
</body></html>
