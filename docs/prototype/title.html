<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Тайтл</title><style>
.hero{display:flex;gap:var(--sp-4);padding:var(--sp-4)}
.hero .cover{width:108px;aspect-ratio:2/3;border-radius:var(--r-m);
  background:var(--surface-variant);flex:none}
.hero h2{font-size:18px;line-height:1.25;margin-bottom:var(--sp-2)}
.actions{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-4)}
.actions .btn{flex:1;text-align:center}
.src{display:flex;align-items:center;gap:var(--sp-2);margin:0 var(--sp-4) var(--sp-4);
  padding:var(--sp-3);background:var(--surface-container);border-radius:var(--r-m);font-size:13px}
.desc{padding:0 var(--sp-4) var(--sp-4);font-size:14px;line-height:1.5;
  color:var(--on-surface-variant)}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chaps{padding:0 var(--sp-4) var(--sp-8)}
.chaps h3{font-size:15px;margin-bottom:var(--sp-2)}
.ch{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;
  border-bottom:1px solid var(--outline)}
.ch.read{opacity:.45}
.ch .t{font-size:14px}
.ch .dl{font-size:16px;color:var(--on-surface-variant)}
.ch .dl.done{color:var(--primary)}
.ch.broken .t{color:var(--error)}
</style></head><body>
<div class="appbar"><a class="icon" href="index.html">←</a><h1></h1>
  <button class="icon">⌕</button><button class="icon">⋮</button></div>
<div class="hero"><div class="cover" id="cov"></div>
  <div><h2 id="ttl"></h2><div class="muted">Автор · Выходит</div>
  <div class="muted" id="meta"></div>
  <div class="row" id="gen" style="margin-top:var(--sp-3);flex-wrap:wrap;gap:6px"></div></div></div>
<div class="fmtbar" id="fb"></div>
<div class="actions"><button class="btn">✚ В библиотеке</button>
  <a class="btn primary" id="cont"></a></div>
<div class="src"><span>Источник: <b id="srcn"></b></span><span style="flex:1"></span>
  <button class="chip" onclick="App.sheet(1)">Сменить</button></div>
<div class="banner" id="warn">Часть глав не найдена у этого источника. Можно мигрировать —
  прогресс сохранится.</div>
<p class="desc clamp" id="desc" onclick="this.classList.toggle('clamp')"></p>
<div class="sechead"><h3>Персонажи</h3><a class="chip" id="allch">Все</a></div>
<div class="charrail" id="chr"></div>
<div class="sechead"><h3>Обсуждение</h3><a class="chip" id="allc">Все</a></div>
<div style="padding:0 var(--sp-4)" id="cmt"></div>
<div style="padding:var(--sp-2) var(--sp-4) var(--sp-4)">
  <button class="btn" style="width:100%" id="wr">Написать комментарий</button></div>
<div class="chaps"><h3 id="chh">Главы</h3><div id="list"></div></div>
<div class="scrim" id="sc" onclick="App.sheet(0)"></div>
<div class="sheet" id="sh"><h3>Источник</h3>
  <div class="ch"><div class="t">MangaHub · 120 гл.</div><span style="flex:1"></span>
    <span style="color:var(--primary)">✓</span></div>
  <div class="ch"><div class="t">ReadManga · 118 гл.</div></div>
  <div class="ch"><div class="t">MangaDex · 95 гл. (EN)</div></div>
  <button class="btn primary" style="width:100%;margin-top:var(--sp-4)"
    onclick="App.sheet(0);App.toast('Тайтл мигрирован')">Мигрировать сюда</button></div>
<script>
var it=App.item(App.q('id',1)),fid=App.fidOf(it.id),fr=App.fr(fid),sib=App.frItems(fid);
cov.style.background=fr.bg;
ttl.textContent=fr.t;
meta.textContent=DB.typeName[it.type]+' · '+it.count;
gen.innerHTML=fr.g.map(function(g){return '<span class="chip">'+g+'</span>'}).join('');
srcn.textContent=it.src;
warn.style.display=it.broken?'':'none';
desc.textContent=fr.d;
fb.innerHTML=["manga","anime","novel"].map(function(k){
 var o=sib.filter(function(x){return x.type===k})[0];
 if(!o)return '<a class="off"><div class="k">'+DB.typeName[k]+'</div><div class="v">нет</div></a>';
 return '<a class="'+(o.id===it.id?'on':'')+'" href="title.html?id='+o.id+'">'+
  '<div class="k">'+DB.typeName[k]+'</div><div class="v">'+o.count+'</div></a>'}).join('');
if(sib.length<2)fb.style.display='none';
var go=App.read(it),unit=it.type==='anime'?'Эпизод':'Глава';
cont.href=go;cont.textContent='Продолжить · '+(it.type==='anime'?'эп. 8':'гл. 43');
chh.textContent=it.type==='anime'?'Эпизоды':'Главы';
var rows='';for(var n=45;n>=38;n--){var bad=it.broken&&n===41;
 rows+='<a class="ch '+(n<43?'read':'')+' '+(bad?'broken':'')+'" href="'+go+'&ch='+n+'">'+
 '<div><div class="t">'+unit+' '+n+'</div><div class="muted">'+
 (bad?'Не загружается':'12.0'+n%9+'.2026')+'</div></div><span style="flex:1"></span>'+
 '<span class="dl '+(n>43?'done':'')+'">'+(n>43?'✓':'↓')+'</span></a>'}
list.innerHTML=rows;
chr.innerHTML=DB.chars.map(function(c){return '<a href="char.html?id='+c.id+'&from='+it.id+'">'+
 '<div class="avat '+(c.main?'main':'')+'"></div><div class="nm">'+c.n+'</div>'+
 '<div class="ro">'+c.role+'</div></a>'}).join('');
allch.href='chars.html?id='+it.id;allch.textContent='Все '+DB.chars.length;
cmt.innerHTML=DB.comments.slice(0,2).map(function(c){return '<div class="cm"><div class="av"></div>'+
 '<div class="bd"><div class="hd"><b>'+c.u+'</b><span class="tag">'+DB.typeName[c.fmt]+
 (c.ch?' · '+c.ch:'')+'</span><span class="muted">'+c.time+'</span></div>'+
 '<div class="tx '+(c.sp?'spoiler':'')+'" onclick="this.classList.add(\'show\')">'+c.t+'</div>'+
 '<div class="ac"><span>♥ '+c.likes+'</span><span>Ответить</span>'+
 (c.rep.length?'<span>'+c.rep.length+' отв.</span>':'')+'</div></div></div>'}).join('');
var link='comments.html?id='+it.id;
allc.href=link;allc.textContent='Все '+DB.comments.length;
wr.onclick=function(){location.href=link+'&write=1'};
</script><script src="srcpick.js"></script>
<script src="migrate.js"></script>
<script src="hist.js"></script>
<script src="nav.js" data-tab=""></script>
<script src="anim.js"></script>
<script src="auth.js"></script>
</body></html>
