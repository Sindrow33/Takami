<!DOCTYPE html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="theme-color" content="#0F1116">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="aurora.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Библиотека</title><style>
.tabs{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3);overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:var(--sp-3);padding:0 var(--sp-4)}
.card{position:relative}
.cover{aspect-ratio:2/3;width:100%;border-radius:var(--r-m);background:var(--surface-variant)}
.card.multi .cover{box-shadow:4px -4px 0 -1px #232833,4px -4px 0 0 #FFFFFF14,
  8px -8px 0 -1px #1B1F27,8px -8px 0 0 #FFFFFF0D}
.badge{position:absolute;top:var(--sp-2);right:var(--sp-2);font-size:11px;
  padding:2px 6px;border-radius:var(--r-s);background:var(--primary);color:var(--on-primary)}
.badge.off{background:var(--surface-container);color:var(--on-surface-variant)}
.badge.err{background:var(--error)}
.name{font-size:13px;margin-top:var(--sp-2);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style></head><body>
<div class="appbar"><h1>Библиотека</h1>
  <button class="icon" aria-label="Поиск">⌕</button><button class="icon" aria-label="Меню">⋮</button></div>
<div class="tabs" id="f"><button class="chip" aria-selected="true">Всё</button>
  <button class="chip">Манга</button><button class="chip">Аниме</button>
  <button class="chip">Ранобэ</button></div>
<div class="grid" id="grid"></div>
<script>
var F={"Всё":0,"Манга":"manga","Аниме":"anime","Ранобэ":"novel"};
function draw(f){
 var out=[];
 for(var fid in DB.fr){
  var its=App.frItems(fid);
  var shown=f?its.filter(function(x){return x.type===f}):its;
  if(!shown.length)continue;
  var fr=DB.fr[fid],head=shown[0],multi=its.length>1;
  var fmts=multi?'<div class="fmts">'+["manga","anime","novel"].map(function(k){
    var o=its.filter(function(x){return x.type===k})[0];
    return '<span class="'+(!o?'miss':(o.id===head.id?'on':''))+'">'+DB.short[k]+'</span>'
   }).join('')+'</div>':'';
  out.push('<a class="card '+(multi?'multi':'')+'" href="title.html?id='+head.id+'">'+
   '<div class="cover" style="background:'+fr.bg+'"></div>'+
   (multi?'<span class="stack">'+its.length+' формата</span>':'')+
   (head.badge?'<span class="badge '+(head.badge==='off'?'off':head.badge==='err'?'err':'')+
     '">'+(head.badge==='off'?'↓':head.badge==='err'?'!':head.badge)+'</span>':'')+
   '<div class="name">'+fr.t+'</div><div class="muted">'+head.sub+'</div>'+
   '<div class="progress" style="margin-top:4px"><i style="width:'+head.prog+'%"></i></div>'+
   fmts+'</a>');
 }
 document.getElementById('grid').innerHTML=out.join('');
}
App.chips(document.getElementById('f'),function(n){draw(F[n])});draw(0);
</script>
<script src="nav.js" data-tab="library"></script>
<script src="anim.js"></script>
<script src="auth.js"></script>
</body></html>
