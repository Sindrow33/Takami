<!DOCTYPE html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="theme-color" content="#0F1116">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="aurora.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Плеер</title><style>
body{background:#000;height:100vh;overflow:hidden}
#video{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#1B2029,#000);
  display:flex;align-items:center;justify-content:center;color:#3A4150}
.tap{position:absolute;inset:0;display:flex;z-index:10}
.tap div{flex:1}
.ov{position:absolute;inset:0;z-index:20;
  background:linear-gradient(#000B,#0000 30%,#0000 60%,#000C);
  opacity:0;transition:opacity var(--t-med);pointer-events:none}
.ov.on{opacity:1;pointer-events:auto}
.ovtop{position:absolute;top:0;left:0;right:0;padding:var(--sp-3) var(--sp-4)}
.ovmid{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);
  display:flex;justify-content:center;gap:var(--sp-8);font-size:30px}
.ovbot{position:absolute;bottom:0;left:0;right:0;padding:var(--sp-3) var(--sp-4) var(--sp-4)}
.skip{position:absolute;right:var(--sp-4);bottom:96px;z-index:25;display:none}
.skip.on{display:block}
.tst{position:absolute;top:45%;z-index:26;background:#000A;padding:var(--sp-3) var(--sp-4);
  border-radius:var(--r-m);font-size:14px;opacity:0;transition:opacity var(--t-fast)}
.tst.on{opacity:1}
#tl{left:12%}#tr{right:12%}
</style></head><body class="immersive">
<div id="video">видео</div>
<div class="tap" id="tap"><div data-z="l"></div><div data-z="c"></div><div data-z="r"></div></div>
<div class="tst" id="tl">« 10 сек</div><div class="tst" id="tr">10 сек »</div>
<button class="btn primary skip" id="skip">Пропустить опенинг</button>
<div class="ov" id="ov">
 <div class="ovtop"><div class="row"><a class="icon" onclick="App.back()">←</a>
  <div style="flex:1"><div style="font-size:14px" id="ep"></div>
  <div class="muted" id="tn"></div></div>
  <button class="icon" onclick="App.sheet(1)">⚙</button></div></div>
 <div class="ovmid"><span>⏮</span><span id="pp">⏸</span><span>⏭</span></div>
 <div class="ovbot"><input type="range" id="seek" min="0" max="1440" value="750">
  <div class="row" style="justify-content:space-between">
   <span class="muted" id="tcur">12:30</span>
   <button class="chip" onclick="App.sheet(1)">1080p · Сабы</button>
   <span class="muted">24:00</span></div></div></div>
<div class="scrim" id="sc" onclick="App.sheet(0)"></div>
<div class="sheet" id="sh"><h3>Качество</h3>
 <div class="seg"><button>480p</button><button>720p</button><button class="on">1080p</button></div>
 <h3 style="margin-top:var(--sp-6)">Скорость</h3>
 <div class="seg"><button>0.75</button><button class="on">1.0</button>
  <button>1.25</button><button>1.5</button><button>2.0</button></div>
 <h3 style="margin-top:var(--sp-6)">Озвучка и субтитры</h3>
 <div class="row" style="flex-wrap:wrap;gap:6px">
  <span class="chip" aria-selected="true">AniLibria</span>
  <span class="chip">JP + рус. сабы</span><span class="chip">Studio Band</span></div>
 <div class="row" style="margin-top:var(--sp-6);justify-content:space-between">
  <span>Автопропуск опенинга</span><input type="checkbox" checked></div>
 <div class="row" style="margin-top:var(--sp-4);justify-content:space-between">
  <span>Автовоспроизведение</span><input type="checkbox" checked></div></div>
<script>
var it=App.item(App.q('id',2));
ep.textContent='Эпизод '+App.q('ch',7)+' — «Название серии»';
tn.textContent=App.frOfItem(it.id).t+' · '+it.src;
var t=750,playing=true,ui=false,last=0;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
setInterval(function(){if(!playing)return;t=Math.min(1440,t+1);seek.value=t;
 tcur.textContent=fmt(t);skip.classList.toggle('on',t>60&&t<150)},1000);
seek.oninput=function(e){t=+e.target.value;tcur.textContent=fmt(t)};
function flash(el){el.classList.add('on');setTimeout(function(){el.classList.remove('on')},500)}
tap.onclick=function(e){var z=e.target.dataset.z,now=Date.now(),dbl=now-last<300;last=now;
 if(dbl&&z==='l'){t=Math.max(0,t-10);flash(tl)}
 else if(dbl&&z==='r'){t=Math.min(1440,t+10);flash(tr)}
 else if(dbl&&z==='c'){playing=!playing;pp.textContent=playing?'⏸':'▶';return}
 else{ui=!ui;ov.classList.toggle('on',ui);return}
 seek.value=t;tcur.textContent=fmt(t)};
pp.onclick=function(e){e.stopPropagation();playing=!playing;pp.textContent=playing?'⏸':'▶'};
skip.onclick=function(){t=150;seek.value=t;tcur.textContent=fmt(t)};
</script><script src="srcpick.js"></script>
<script src="hist.js"></script>
<script src="nav.js" data-tab=""></script>
<script src="anim.js"></script>
</body></html>
