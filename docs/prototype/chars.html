<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Персонажи</title><style>
.tabs{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3);overflow-x:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);padding:0 var(--sp-4)}
.c{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-2);
  border-radius:var(--r-m);background:var(--surface-container)}
.c .av{width:52px;height:52px;border-radius:var(--r-full);
  background:var(--surface-variant);flex:none}
.c .nm{font-size:13px;line-height:1.25}
.c .ro{font-size:11px;color:var(--on-surface-variant);margin-top:2px}
.c.main{border:1px solid #7C5CFF55}
</style></head><body>
<div class="appbar"><a class="icon" onclick="App.back()">←</a><h1>Персонажи</h1>
  <button class="icon">⌕</button></div>
<div class="tabs" id="f"><button class="chip" aria-selected="true">Все</button>
  <button class="chip">Главные</button><button class="chip">Второстепенные</button></div>
<div class="grid" id="g"></div>
<script>
var from=App.q('id',1);
function draw(f){g.innerHTML=DB.chars.filter(function(c){
  return f==='Главные'?c.main:f==='Второстепенные'?!c.main:true})
 .map(function(c){return '<a class="c '+(c.main?'main':'')+'" href="char.html?id='+c.id+
  '&from='+from+'"><div class="av"></div><div><div class="nm">'+c.n+'</div>'+
  '<div class="ro">'+c.role+'</div></div></a>'}).join('')}
App.chips(f,draw);draw('Все');
</script><script src="nav.js" data-tab="more"></script>
<script src="anim.js"></script>
<script src="auth.js"></script>
</body></html>
