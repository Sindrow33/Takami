<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Новости</title><style>
.tabs{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3);overflow-x:auto}
.sync{padding:0 var(--sp-4) var(--sp-3);font-size:12px;color:var(--on-surface-variant)}
.hero{position:relative;display:block;margin:0 var(--sp-4) var(--sp-4);
  border-radius:var(--r-l);overflow:hidden;aspect-ratio:16/9;
  background:linear-gradient(150deg,#2A2140,#141821)}
.hero .g{position:absolute;inset:0;background:linear-gradient(#0000 35%,#0F1115F2)}
.hero .c{position:absolute;left:0;right:0;bottom:0;padding:var(--sp-4)}
.hero h2{font-size:17px;line-height:1.3;margin:var(--sp-2) 0}
.sec{padding:0 var(--sp-4) var(--sp-2);font-size:15px;font-weight:600}
.rail{display:flex;gap:var(--sp-3);overflow-x:auto;padding:0 var(--sp-4) var(--sp-4)}
.rail a{width:116px;flex:none}
.rail .cv{width:100%;aspect-ratio:2/3;border-radius:var(--r-m);background:var(--surface-variant)}
.rail .nm{font-size:12px;margin-top:6px;line-height:1.3}
.n{display:flex;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--outline)}
.n .th{width:100px;aspect-ratio:16/10;border-radius:var(--r-m);
  background:var(--surface-variant);flex:none}
.n h3{font-size:14px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.n .meta{margin-top:var(--sp-2);display:flex;gap:var(--sp-2);align-items:center;
  font-size:11px;color:var(--on-surface-variant);flex-wrap:wrap}
.n.read{opacity:.45}
</style></head><body>
<div class="appbar"><h1>Новости</h1><button class="icon">⌕</button>
  <button class="icon" onclick="load(1)">↻</button></div>
<div class="tabs" id="f"><button class="chip" aria-selected="true">Всё</button>
  <button class="chip">Мои тайтлы</button><button class="chip">Аниме</button>
  <button class="chip">Манга</button><button class="chip">Ранобэ</button></div>
<div class="sync" id="st">Обновлено 5 мин назад</div>
<div class="banner" id="bn" style="display:none">Источник AnimeGo не отвечает —
  показаны сохранённые записи.</div>
<div id="body"></div>
<script src="nav.js" data-tab="more"></script>
<script>
var news=[
 {t:"Второй сезон получил дату премьеры — январь 2027",s:"AniLibria",a:"2 ч",g:"Аниме",n:1,r:0},
 {t:"Манга уходит на перерыв до конца месяца",s:"MangaHub",a:"5 ч",g:"Манга",n:1,r:0},
 {t:"Официальный перевод ранобэ анонсирован издательством",s:"RanobeLib",a:"вчера",g:"Ранобэ",n:0,r:0},
 {t:"Студия показала первый трейлер экранизации",s:"MangaDex",a:"вчера",g:"Индустрия",n:0,r:1},
 {t:"Автор подтвердил финальную арку в следующем томе",s:"MangaHub",a:"2 дня",g:"Манга",n:0,r:1}];
var skel='';for(var i=0;i<4;i++)skel+='<div class="n"><div class="th sk"></div>'+
 '<div style="flex:1"><div class="sk" style="height:14px;margin-bottom:8px"></div>'+
 '<div class="sk" style="height:14px;width:70%;margin-bottom:8px"></div>'+
 '<div class="sk" style="height:10px;width:40%"></div></div></div>';
function render(){
 var rail='';for(var k=0;k<6;k++)rail+='<a href="title.html?id=1"><div class="cv"></div>'+
  '<div class="nm">Тайтл сезона '+(k+1)+'</div><div class="muted" style="font-size:11px">с 9 января</div></a>';
 document.getElementById('body').innerHTML=
 '<a class="hero" href="article.html"><div class="g"></div><div class="c">'+
 '<span class="tag live">Главное</span>'+
 '<h2>Экранизация ранобэ официально подтверждена: премьера весной</h2>'+
 '<div class="muted">AniLibria · 40 мин назад</div></div></a>'+
 '<div class="sec">Сезон зима 2027</div><div class="rail">'+rail+'</div>'+
 '<div class="sec">Лента</div>'+
 news.map(function(x){return '<a class="n '+(x.r?'read':'')+'" href="article.html">'+
  '<div class="th"></div><div style="flex:1"><h3>'+x.t+'</h3><div class="meta">'+
  '<span class="tag '+(x.n?'new':'')+'">'+x.g+'</span><span>'+x.s+'</span>'+
  '<span>·</span><span>'+x.a+'</span></div></div></a>'}).join('');
}
function load(manual){document.getElementById('body').innerHTML=skel;
 st.textContent='Обновление…';
 setTimeout(function(){render();st.textContent='Обновлено только что';
  bn.style.display=manual?'block':'none'},700)}
App.chips(f,function(){load(0)});load(0);
</script><script src="anim.js"></script>
<script src="auth.js"></script>
</body></html>
