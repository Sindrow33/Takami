<!DOCTYPE html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="theme-color" content="#0F1116">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="aurora.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Обсуждение</title><style>
body{padding-bottom:96px}
.appbar{background:#0F1115F2;backdrop-filter:blur(10px)}
.tabs{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3);overflow-x:auto;
  position:sticky;top:56px;background:var(--surface);z-index:19}
.wrap{padding:0 var(--sp-4)}
.cm+.cm{border-top:1px solid var(--outline)}
.mine .bd{background:#7C5CFF14;border-radius:var(--r-m);padding:var(--sp-2) var(--sp-3)}
.pinned{border:1px solid #7C5CFF44;border-radius:var(--r-m);
  padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-2)}
.replyto{display:none;align-items:center;gap:var(--sp-2);font-size:12px;
  padding:var(--sp-2) var(--sp-4);background:var(--surface-container);
  position:fixed;bottom:66px;left:0;right:0;z-index:39;color:var(--on-surface-variant)}
.replyto.on{display:flex}
</style></head><body>
<div class="appbar"><a class="icon" onclick="App.back()">←</a>
 <div style="flex:1"><div style="font-size:15px">Обсуждение</div>
  <div class="muted" id="sub"></div></div><button class="icon" aria-label="Поиск">⌕</button></div>
<div class="tabs" id="f"><button class="chip" aria-selected="true">Все</button>
 <button class="chip">Манга</button><button class="chip">Аниме</button>
 <button class="chip">Ранобэ</button></div>
<div class="wrap">
 <div class="pinned"><div class="row" style="gap:var(--sp-2)">
  <span class="tag new">Закреплено</span><span class="muted">модератор</span></div>
  <div style="font-size:13px;margin-top:6px">Спойлеры скрываются автоматически —
   тапните, чтобы раскрыть.</div></div>
 <div class="row" style="justify-content:space-between;padding:var(--sp-2) 0">
  <span class="muted" id="cnt"></span>
  <button class="chip" id="sort">Сначала популярные</button></div>
 <div id="list"></div></div>
<div class="replyto" id="rt"><span id="rtn"></span><span style="flex:1"></span>
 <button class="chip" onclick="rt.classList.remove('on')">✕</button></div>
<div class="inputbar"><button class="icon">☺</button>
 <input id="inp" placeholder="Комментарий…"><button class="send" id="snd">➤</button></div>
<script>
var it=App.item(App.q('id',1));sub.textContent=App.frOfItem(it.id).t;
var data=DB.comments.slice(),pop=true,cur=0;
function draw(f){
 var L=data.filter(function(c){return !f||c.fmt===f});
 cnt.textContent=L.length+' комментариев';
 list.innerHTML=L.map(function(c){return '<div class="cm '+(c.mine?'mine':'')+'">'+
  '<div class="av"></div><div class="bd"><div class="hd"><b>'+c.u+'</b>'+
  '<span class="tag">'+DB.typeName[c.fmt]+(c.ch?' · '+c.ch:'')+'</span>'+
  '<span class="muted">'+c.time+'</span></div>'+
  '<div class="tx '+(c.sp?'spoiler':'')+'" onclick="this.classList.add(\'show\')">'+c.t+'</div>'+
  '<div class="ac"><span onclick="like(this)">♥ '+c.likes+'</span>'+
  '<span onclick="reply(\''+c.u+'\')">Ответить</span></div>'+
  c.rep.map(function(r){return '<div class="rep"><div class="cm" style="padding:6px 0">'+
    '<div class="av" style="width:26px;height:26px"></div><div class="bd">'+
    '<div class="hd"><b>'+r.u+'</b><span class="muted">'+r.time+'</span></div>'+
    '<div class="tx">'+r.t+'</div>'+
    '<div class="ac"><span onclick="like(this)">♥ '+r.likes+'</span></div>'+
    '</div></div></div>'}).join('')+'</div></div>'}).join('');
}
function like(el){el.textContent='♥ '+(+el.textContent.replace(/\D/g,'')+1);
 el.style.color='#FF5C5C'}
function reply(u){rt.classList.add('on');rtn.textContent='Ответ для '+u;inp.focus()}
snd.onclick=function(){var v=inp.value.trim();if(!v)return;
 data.unshift({u:"Вы",t:v,time:"сейчас",likes:0,fmt:it.type,ch:"Гл. 43",sp:0,rep:[],mine:1});
 inp.value='';rt.classList.remove('on');draw(cur);
 App.toast('Комментарий отправлен',function(){data.shift();draw(cur)});
 scrollTo({top:0,behavior:'smooth'})};
var M={"Все":0,"Манга":"manga","Аниме":"anime","Ранобэ":"novel"};
App.chips(f,function(n){cur=M[n];draw(cur)});
sort.onclick=function(){pop=!pop;sort.textContent=pop?'Сначала популярные':'Сначала новые';
 if(pop)data.sort(function(a,b){return b.likes-a.likes});draw(cur)};
data.sort(function(a,b){return b.likes-a.likes});draw(0);
if(App.q('write'))setTimeout(function(){inp.focus()},300);
</script><script src="nav.js" data-tab=""></script>
<script src="anim.js"></script>
<script src="auth.js"></script>
</body></html>
