<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Ранобэ</title><style>
body{transition:background var(--t-med),color var(--t-med)}
body[data-th="sepia"]{background:#F3E9D2;color:#3B3226}
body[data-th="black"]{background:#000;color:#C8CCD4}
article{padding:var(--sp-6) var(--sp-4) 120px;max-width:680px;margin:0 auto;
  font-size:var(--fs,18px);line-height:var(--lh,1.7);text-align:justify;hyphens:auto}
article h2{font-size:calc(var(--fs,18px) + 4px);margin-bottom:var(--sp-6);text-align:left}
article p{margin-bottom:1em;text-indent:1.2em}
.tap{position:fixed;inset:0;z-index:5}
.top,.bot{position:fixed;left:0;right:0;z-index:40;background:var(--surface-container);
  color:var(--on-surface);transition:transform var(--t-med)}
.top{top:0;padding:var(--sp-3) var(--sp-4);transform:translateY(-100%)}
.bot{bottom:0;padding:var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  transform:translateY(100%)}
.ui-open .top,.ui-open .bot{transform:none}
.fixbar{position:fixed;bottom:0;left:0;right:0;height:24px;z-index:3;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 var(--sp-4);font-size:11px;opacity:.5}
</style></head><body class="immersive" data-th="dark">
<div class="tap" onclick="document.body.classList.toggle('ui-open')"></div>
<article id="txt"><h2 id="h"></h2></article>
<div class="fixbar"><span id="fb"></span><span id="pc">0%</span></div>
<div class="top"><div class="row"><a class="icon" onclick="App.back()">←</a>
 <div style="flex:1"><div style="font-size:14px" id="tn"></div>
 <div class="muted" id="sub"></div></div>
 <button class="icon">☰</button><button class="icon" onclick="App.sheet(1)">Aa</button></div></div>
<div class="bot"><input type="range" id="sl" min="0" max="100" value="0">
 <div class="row" style="justify-content:space-between;margin-top:var(--sp-2)">
  <button class="chip">← Гл. 4</button><span class="muted" id="pc2">0%</span>
  <button class="chip">Гл. 6 →</button></div></div>
<div class="scrim" id="sc" onclick="App.sheet(0)"></div>
<div class="sheet" id="sh"><h3>Тема</h3>
 <div class="seg" id="th"><button class="on" data-t="dark">Тёмная</button>
  <button data-t="sepia">Сепия</button><button data-t="black">AMOLED</button></div>
 <h3 style="margin-top:var(--sp-6)">Размер шрифта</h3>
 <input type="range" id="fs" min="14" max="28" value="18">
 <h3 style="margin-top:var(--sp-6)">Межстрочный интервал</h3>
 <input type="range" id="lh" min="130" max="220" value="170">
 <div class="row" style="margin-top:var(--sp-6);justify-content:space-between">
  <span>Листание вместо скролла</span><input type="checkbox"></div>
 <div class="row" style="margin-top:var(--sp-4);justify-content:space-between">
  <span>Озвучка TTS</span><input type="checkbox"></div></div>
<script>
var it=App.item(App.q('id',3)),ch=App.q('ch',5);
tn.textContent=App.frOfItem(it.id).t;sub.textContent='Глава '+ch+' из 210';
h.textContent='Глава '+ch+'. Название главы';fb.textContent='Глава '+ch;
var P="Текст главы для проверки читаемости, переносов и межстрочного интервала. "+
"Здесь важно увидеть, как ведёт себя длинный абзац при разных размерах шрифта и темах. ";
var s='';for(var i=0;i<14;i++)s+='<p>'+P+P+P+'</p>';
txt.insertAdjacentHTML('beforeend',s);
th.onclick=function(e){var b=e.target.closest('button');if(!b)return;
 [].forEach.call(th.children,function(x){x.classList.remove('on')});b.classList.add('on');
 document.body.dataset.th=b.dataset.t};
fs.oninput=function(e){document.documentElement.style.setProperty('--fs',e.target.value+'px')};
lh.oninput=function(e){document.documentElement.style.setProperty('--lh',e.target.value/100)};
addEventListener('scroll',function(){
 var d=Math.max(1,document.body.scrollHeight-innerHeight);
 var p=Math.round(scrollY/d*100);pc.textContent=pc2.textContent=p+'%';sl.value=p});
</script><script src="srcpick.js"></script>
<script src="migrate.js"></script>
<script src="hist.js"></script>
<script src="nav.js" data-tab=""></script>
<script src="anim.js"></script>
</body></html>
