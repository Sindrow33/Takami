<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="anim.css">
<script src="data.js"></script><script src="app.js"></script><script src="cfg.js"></script>
<title>Сэйю</title><style>
.appbar{position:fixed;left:0;right:0;background:#0F1115B3;backdrop-filter:blur(10px)}
.head{padding:72px var(--sp-4) var(--sp-4);
  background:radial-gradient(90% 70% at 70% 0%,#23314F,#0F1115 70%)}
.head .av{width:96px;height:96px;border-radius:var(--r-full);
  background:var(--surface-variant);border:2px solid #FFFFFF22;flex:none}
.head h2{font-size:19px}
.wrap{padding:0 var(--sp-4) var(--sp-8)}
.role{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;
  border-bottom:1px solid var(--outline)}
.role .av{width:44px;height:44px;border-radius:var(--r-full);
  background:var(--surface-variant);flex:none}
.role .cv{width:34px;aspect-ratio:2/3;border-radius:var(--r-s);
  background:var(--surface-variant);flex:none}
.inlib{color:var(--primary);font-size:11px}
</style></head><body>
<div class="appbar"><a class="icon" onclick="App.back()">←</a><span style="flex:1"></span>
  <button class="icon">☆</button></div>
<div class="head"><div class="row" style="gap:var(--sp-4)"><div class="av"></div>
  <div><h2>Имя Актёра</h2><div class="muted">声優名 · Япония</div>
  <div class="row" style="gap:6px;margin-top:var(--sp-3)"><span class="tag">128 ролей</span>
   <span class="tag new">3 в библиотеке</span></div></div></div></div>
<div class="wrap"><div class="sechead" style="padding-left:0"><h3>Роли</h3>
  <button class="chip">Сначала главные</button></div><div id="r"></div></div>
<script>
var R=[[1,"Тайтл с длинным названием","Главная",1],[2,"Аниме сериал","Главная",1],
[5,"Ещё один тайтл","Второстеп.",0],[3,"Новинка сезона","Второстеп.",1],
[4,"Другой сериал","Эпизод",0]];
r.innerHTML=R.map(function(x){var c=App.char(x[0]);
 return '<a class="role" href="char.html?id='+c.id+'"><div class="av"></div><div class="cv"></div>'+
 '<div style="flex:1"><div style="font-size:14px">'+c.n+'</div>'+
 '<div class="muted">'+x[1]+'</div></div><div style="text-align:right">'+
 '<div class="muted">'+x[2]+'</div>'+(x[3]?'<div class="inlib">в библиотеке</div>':'')+
 '</div></a>'}).join('');
</script><script src="nav.js" data-tab="more"></script>
<script src="anim.js"></script>
<script src="auth.js"></script>
</body></html>
